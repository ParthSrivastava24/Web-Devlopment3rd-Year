<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
    let a = 20;
    let b = 30;
    var c = a+b;
    var d = a/b;
    var e = a%b;
    var f = a*b;
    var g = a-b;
    alert(c);
    alert(d);
    alert(e);
    alert(f);
    alert(g);

    if(a>b){
        alert ("bada");
    }else{
        alert("chota");
    }
    </script>
    
    
</body>
</html>
