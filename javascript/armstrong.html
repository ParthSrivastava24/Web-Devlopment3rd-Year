<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = Number(prompt("Enter a number:"));

        let original = n;
        let sum = 0;

    while (n > 0) {
        let digit = n % 10;
        sum = sum + digit ** 3;
        n = Math.floor(n / 10);
    }

    if (sum === original) {
        document.write(original + " is an Armstrong number");
    } else {
        document.write(original + " is not an Armstrong number");
    }

    </script>
</body>
</html>
